<title>Учебные результаты школьников: данные и объяснения</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314213d'/%3E%3Cpath d='M12 45h40M16 39l9-10 8 6 15-19' fill='none' stroke='%23ff6b35' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#14213d;--muted:#667085;--line:#d8e0eb;--paper:#f7f9fc;--blue:#2563eb;--orange:#f05a28;--red:#d92d20;--green:#17865b;--cyan:#0f8fa8;--shadow:0 18px 50px #14213d18}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--paper);color:var(--ink);font:16px/1.4 Inter,Segoe UI,Arial,sans-serif}.slide{position:absolute;inset:0;display:none;overflow:auto;padding:clamp(24px,4vw,58px) clamp(20px,6vw,94px) 90px;background:linear-gradient(90deg,#2563eb08 1px,transparent 1px),linear-gradient(#2563eb08 1px,transparent 1px),var(--paper);background-size:40px 40px}.slide.active{display:block}.frame{width:min(1400px,100%);min-height:calc(100vh - 150px);margin:auto;display:flex;flex-direction:column;justify-content:center}h1,h2,h3,p{margin-top:0}h1{max-width:1100px;margin-bottom:26px;font-size:clamp(3.2rem,7vw,7.1rem);line-height:.93;letter-spacing:-.06em}h2{max-width:1250px;margin-bottom:clamp(20px,3vh,34px);font-size:clamp(2rem,4.2vw,4.5rem);line-height:1;letter-spacing:-.045em}h3{font-size:clamp(1.05rem,1.7vw,1.4rem);line-height:1.2}.subtitle{max-width:800px;color:var(--muted);font-size:clamp(1.2rem,2.1vw,2rem)}.num{font-weight:850;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}.hero{font-size:clamp(3.2rem,8vw,8.3rem)}.big{font-size:clamp(2.2rem,4.8vw,5rem)}.small{font-size:clamp(1.05rem,1.8vw,1.45rem)}.red{color:var(--red)}.orange{color:var(--orange)}.blue{color:var(--blue)}.green{color:var(--green)}.g2,.g3,.g4{display:grid;gap:clamp(14px,2.2vw,28px);align-items:stretch}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fffffff2;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,2.4vw,31px);box-shadow:var(--shadow)}.card p:last-child{margin-bottom:0}.metric{display:flex;flex-direction:column;gap:8px}.metric p{margin:0;color:var(--muted)}.take{margin:clamp(18px,3vh,32px) 0 0;padding:15px 18px;border-left:5px solid var(--blue);border-radius:0 12px 12px 0;background:#fff;font-size:clamp(1rem,1.65vw,1.35rem);font-weight:650;max-width:1240px}.warn{border-left-color:var(--orange)}.note{margin-top:10px;color:var(--muted);font-size:.84rem}.source{display:inline-block;margin-top:13px;color:#475467;font-size:.82rem;text-decoration:none;border-bottom:1px solid #98a2b3}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.chips span{padding:9px 13px;background:#fff;border:1px solid var(--line);border-radius:999px}.bars{display:grid;gap:17px}.barrow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:13px;align-items:center}.track{height:27px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar{height:100%;width:var(--w);background:var(--c,var(--blue));border-radius:99px;transform-origin:left}.value{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.chart{display:block;width:100%;height:auto;overflow:visible}.chart text{font:15px Inter,Segoe UI,Arial;fill:#475467}.chart .grid{stroke:#d8e0eb}.chart .line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.chart .dot{stroke:#fff;stroke-width:4}.donut{width:min(330px,70vw);aspect-ratio:1;margin:auto;border-radius:50%;background:conic-gradient(#2563eb 0 48.4%,#f4b740 48.4% 75%,#14b8a6 75% 85.9%,#f05a28 85.9% 95.3%,#98a2b3 95.3%);position:relative}.donut:after{content:'65 исследований';position:absolute;inset:23%;display:grid;place-items:center;text-align:center;background:#fff;border-radius:50%;font-size:1.35rem;font-weight:800}.legend{display:grid;gap:10px;align-content:center}.legend div{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}.sw{width:14px;height:14px;border-radius:4px;background:var(--c)}.yearbar{height:42px;margin:26px 0 8px;border-radius:11px;overflow:hidden;background:#e2e8f0;display:flex}.yearbar b{display:grid;place-items:center}.lost{width:35%;background:var(--orange);color:#fff}.kept{width:65%;color:#475467}.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center}.versus{font-size:1.5rem;color:#98a2b3;font-weight:900}.tag{display:inline-block;margin-bottom:15px;padding:8px 11px;border-radius:8px;background:#eaf1ff;color:#1849a9;font-weight:750}.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.flow span,.node{padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:700}.flow i{font-size:1.6rem;color:var(--blue);font-style:normal}.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.table{width:100%;border-collapse:collapse;background:#fff;font-variant-numeric:tabular-nums}.table th,.table td{padding:12px 15px;border-bottom:1px solid var(--line);text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{font-size:.83rem;color:var(--muted)}.table tr:last-child td{border:0}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative}.timeline:before{content:'';position:absolute;top:29px;left:4%;right:4%;height:3px;background:#cdd7e5}.time{position:relative;padding-top:57px}.time:before{content:'';position:absolute;top:19px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--blue);border:5px solid var(--paper)}.year{font-size:1.55rem;font-weight:850}.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.dir{min-height:108px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:flex-end;font-weight:750;position:relative;overflow:hidden}.dir:before{content:attr(data-n);position:absolute;right:9px;top:0;color:#e7ecf4;font-size:3.5rem;font-weight:900}.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:19px}.outcomes div{padding:13px 15px;border-radius:12px;background:#edf8f3;color:#08724f;font-weight:700}.orbit{display:grid;grid-template-columns:1fr minmax(190px,255px) 1fr;gap:15px;align-items:center}.center{aspect-ratio:1;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;font-size:1.3rem;font-weight:850}.corr{display:grid;gap:11px}.corr div{padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;gap:12px}.eqs{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.eq{padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:11px;font-weight:700}.neq{color:var(--red);font-size:1.4rem}.matrix{display:grid;grid-template-columns:150px repeat(2,1fr);grid-template-rows:auto repeat(2,minmax(120px,1fr));gap:10px}.matrix>div{padding:17px;background:#fff;border:1px solid var(--line);border-radius:14px}.matrix .head,.matrix .side{background:transparent;border:0;font-weight:750}.matrix .head{text-align:center}.matrix .side{display:grid;place-items:center}.target{background:#e9f8f2!important;border:2px solid #24a474!important}.pressure{background:#fff2ef!important}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;counter-reset:n}.step{min-height:170px;padding:23px;background:#fff;border:1px solid var(--line);border-radius:18px}.step:before{counter-increment:n;content:counter(n);display:grid;place-items:center;width:42px;height:42px;margin-bottom:18px;border-radius:50%;background:var(--ink);color:#fff;font-weight:850}.workflow{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:18px}.workflow div{padding:12px 7px;text-align:center;border-radius:10px;background:#eaf1ff;color:#1849a9;font-weight:700}.controls{position:fixed;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;justify-content:center;gap:12px;background:#f7f9fceb;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.nav,.full{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer;font-size:1.3rem}.nav:disabled{opacity:.35}.counter{min-width:68px;text-align:center;font-weight:800}.full{position:absolute;right:22px;font-size:1rem}.progress{position:fixed;left:0;right:0;bottom:67px;height:3px;background:#e4e9f1;z-index:11}.progress span{display:block;height:100%;width:var(--p);background:var(--blue);transition:.25s}.active .card,.active .take,.active .chart,.active .time,.active .step{animation:up .42s both}.active .bar{animation:grow .7s .1s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes grow{from{transform:scaleX(0)}}
@media(max-width:900px){body{overflow:auto}.slide{padding:26px 18px 92px}.frame{min-height:auto;justify-content:flex-start}.g3,.g4,.dirs,.timeline,.outcomes,.steps{grid-template-columns:1fr 1fr}.g2,.compare,.orbit{grid-template-columns:1fr}.versus,.timeline:before{display:none}.nodes{grid-template-columns:1fr 1fr}.time{padding-top:18px}.time:before{top:0}.matrix{grid-template-columns:100px repeat(2,1fr);font-size:.86rem}.matrix>div{padding:11px}.workflow{grid-template-columns:1fr}.eqs{grid-template-columns:1fr}.center{width:220px;justify-self:center}.active .card,.active .take,.active .chart,.active .time,.active .step{animation:none}}@media(max-width:560px){.g3,.g4,.dirs,.timeline,.outcomes,.steps{grid-template-columns:1fr}.barrow{grid-template-columns:1fr 58px}.track{grid-column:1/-1;grid-row:2}.matrix{grid-template-columns:72px repeat(2,1fr)}.eq{padding:12px}.full{right:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{body{overflow:visible}.slide{position:relative;display:block;min-height:100vh;page-break-after:always;padding:45px}.frame{min-height:calc(100vh - 90px)}.controls,.progress{display:none}}
</style>

<body>

<script>
const S={
oecd22:'https://www.oecd.org/en/about/news/press-releases/2023/12/decline-in-educational-performance-only-partly-attributable-to-the-covid-19-pandemic.html',oecd25:'https://www.oecd.org/en/publications/pisa-2025-results-volume-i_73451bc5-en.html',covid:'https://www.nature.com/articles/s41562-022-01506-4',screen:'https://onlinelibrary.wiley.com/doi/10.1111/1467-9817.12461',writing:'https://researchprofiles.canberra.edu.au/en/publications/effect-sizes-ofwriting-modality-onk6-students-writing-andreading-/',sel:'https://onlinelibrary.wiley.com/doi/full/10.1111/cdev.13968',anxiety:'https://www.sciencedirect.com/science/article/pii/S0022440523000158',fioko:'https://nimro.ru/upload/iblock/569/ztngeptx4e01ecnzgclf0w5dkedptws2.pdf',hw:'https://www.kiro46.ru/images/2024/fioko.pdf',curiosity:'https://r1.nubex.ru/s7581-0b2/f5515_b1/%D0%A0%D0%B5%D0%B7%D1%83%D0%BB%D1%8C%D1%82%D0%B0%D1%82%D1%8B%20%20%D0%A0IZA.pdf'};
const src=(u,t)=>`<a class="source" href="${u}">${t}</a>`;
const slides=[
{title:'Что изменилось в учебных результатах школьников',body:'<p class="subtitle">Данные PISA, ФИОКО и метаанализов: динамика результатов, проверенные объяснения и школьные условия.</p>',cover:true},
{title:'Что случилось',body:`<div class="g3"><div class="card"><span class="tag">Инфоповод</span><h3>В СМИ всё чаще пишут о падении базовых навыков</h3><p>Школьники в разных странах показывают более слабые результаты в грамотности, чтении, письме и математике.</p></div><div class="card"><span class="tag">Главный вопрос</span><h3>Это реальное ухудшение или эффект громких заголовков?</h3><p>Нужно отделить измеряемые данные от обобщений о «поколении» и «неспособности учиться».</p></div><div class="card"><span class="tag">Проверим гипотезу</span><h3>Виновато ли «клиповое мышление»?</h3><p>Разберём, что показывают PISA, российские аналоги и метаанализы о чтении, письме, нагрузке и школьной среде.</p></div></div><p class="take">Не могут же дети по всему миру за последние 10-20 лет разучиться учиться?! Или могут?</p>`},
{title:'PISA-2022: спад распределён неравномерно',body:`<div class="g3"><div class="card metric"><span class="num hero red">−15</span><h3>Математика</h3><p>Среднее изменение стран OECD с 2018 года.</p></div><div class="card metric"><span class="num hero orange">−10</span><h3>Чтение</h3><p>Снижение меньше, чем по математике.</p></div><div class="card metric"><span class="num hero green">≈ 0</span><h3>Естественные науки</h3><p>Статистически значимого снижения нет.</p></div></div><div class="chips"><span>почти 700 000 участников</span><span>81 страна и экономика</span><span>спад по математике втрое сильнее прежних межцикловых изменений</span></div><p class="take">Общий тезис об ухудшении скрывает разную динамику по предметным областям.</p>${src(S.oecd22,'OECD, PISA 2022 Results, 2023')}`},
{title:'Чтение: десятилетнее снижение',body:`<div class="g2"><div class="card"><svg class="chart" viewBox="0 0 620 300"><line class="grid" x1="60" y1="70" x2="570" y2="70"/><line class="grid" x1="60" y1="225" x2="570" y2="225"/><path class="line" stroke="#f05a28" d="M70 82C220 105 390 178 560 220"/><circle class="dot" fill="#f05a28" cx="70" cy="82" r="9"/><circle class="dot" fill="#f05a28" cx="560" cy="220" r="9"/><text x="60" y="52">2015</text><text x="525" y="260">2025</text><text x="300" y="145" style="font-size:42px;font-weight:850;fill:#d92d20">−28 баллов</text></svg></div><div class="card"><div class="metric"><span class="num big red">−28</span><h3>Чтение</h3><p>Около 1,5 года обучения в приблизительной интерпретации OECD.</p></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="metric"><span class="num big orange">−22</span><h3>Математика</h3></div></div></div><div class="chips"><span>&gt;760 000 учащихся</span><span>91 страна и экономика</span><span>около 33 млн пятнадцатилетних</span></div><p class="take">Наибольшее долгосрочное снижение в среднем по OECD приходится на чтение.</p>${src(S.oecd25,'OECD, PISA 2025 Results, 2026')}`},
{title:'Быстро прочитал — ответил неверно',body:`<div class="g2"><div class="card" style="text-align:center"><span class="num hero red">9%</span><p class="small">ответов относятся к <i>hasty reading</i>. Доля почти удвоилась с 2018 года.</p></div><div class="card"><h3>Трудные операции</h3><div class="flow"><span>Оценить информацию</span><i>→</i><span>Связать источники</span><i>→</i><span>Осмыслить текст</span></div></div></div><p class="take warn">Показатель совместим с проблемой глубины обработки текста, но не устанавливает причину и не доказывает ухудшение внимания.</p>${src(S.oecd25,'OECD, PISA 2025 Results, Volume I, 2026')}`},
{title:'Пандемия оставила измеримый след',body:`<div class="g2"><div class="card metric"><span class="num hero red">d = −0,14</span><p>Средняя оценка потерь обучения.</p></div><div class="card"><span class="num big orange">≈ 35%</span><p class="small">обычного годового образовательного прогресса</p><div class="yearbar"><b class="lost">35%</b><b class="kept">65%</b></div></div></div><div class="chips"><span>42 исследования</span><span>15 стран</span><span>291 оценка эффекта</span><span>random-effects meta-analysis</span></div><p class="take">Потери появились быстро и не исчезли полностью после возврата к очному обучению. Они объясняют часть спада, но не весь десятилетний тренд.</p>${src(S.covid,'Betthäuser, Bach-Mortensen & Engzell, Nature Human Behaviour, 2023')}`},
{title:'Экран или бумага: результаты 65 исследований',body:`<div class="g2"><div class="card"><div class="donut"></div></div><div class="card legend"><div><i class="sw" style="--c:#2563eb"></i><span>Различий нет</span><b>48,4%</b></div><div><i class="sw" style="--c:#f4b740"></i><span>Бумага лучше</span><b>26,6%</b></div><div><i class="sw" style="--c:#14b8a6"></i><span>Цифровой формат лучше</span><b>10,9%</b></div><div><i class="sw" style="--c:#f05a28"></i><span>Зависит от других факторов</span><b>9,4%</b></div><div><i class="sw" style="--c:#98a2b3"></i><span>Зависит от измерения</span><b>4,7%</b></div></div></div><div class="chips"><span>88 статей</span><span>121 исследование</span><span>2000–2023 годы</span></div><p class="take">Формат экрана сам по себе не объясняет снижение чтения</p>${src(S.screen,'Hare et al., Journal of Research in Reading, 2024')}`},
{title:'Письмо рукой и набор на клавиатуре',body:`<div class="g3"><div class="card metric"><span class="tag">Выборка</span><span class="num" style="font-size:clamp(2.1rem,4vw,4.7rem);white-space:nowrap">22</span><h3>исследования</h3><p>6 168 учащихся K–6: начальная школа и первые годы средней школы.</p></div><div class="card metric"><span class="tag">Ручное письмо</span><span class="num blue" style="font-size:clamp(2.2rem,5vw,5.2rem);white-space:nowrap">0,53</span><h3>размер эффекта</h3><p>Качество текстов младших школьников в среднем было выше при письме рукой.</p></div><div class="card metric"><span class="tag">Клавиатура</span><h3>Не проигрыш во всём</h3><p>Для навыков чтения общей однозначной победы одного формата не обнаружено.</p></div></div><p class="take">Сохранять практику письма рукой и одновременно учить цифровому письму</p>${src(S.writing,'Malpique et al., The Australian Educational Researcher, 2024')}`},
{title:'После PISA-2018 Россия измеряет себя иначе',body:`<div class="compare"><div class="card"><span class="tag">Международная PISA</span><div class="num big">2018</div><p>Последний цикл с участием России.</p></div><div class="versus">→</div><div class="card"><span class="tag">Общероссийская оценка</span><div class="num big blue">265</div><p>организаций из 43 субъектов РФ в исследовании 2022 года.</p></div></div><div class="nodes" style="margin-top:20px"><div class="node">15-летние участники</div><div class="node">Три вида грамотности</div><div class="node">Компьютерное тестирование</div><div class="node">Шкала связана с PISA-2018</div></div><p class="take warn">Методика очень похожа, но выборка меньше. Можно сравнить!</p><p class="note">Возраст в оценке 2022 года: от 15 лет 3 месяцев до 16 лет 2 месяцев.</p>`},
{title:'Россия: динамика 2022–2024',body:`<div class="g2"><div class="card"><svg class="chart" viewBox="0 0 700 360"><line class="grid" x1="70" y1="70" x2="640" y2="70"/><line class="grid" x1="70" y1="180" x2="640" y2="180"/><line class="grid" x1="70" y1="290" x2="640" y2="290"/><path class="line" stroke="#2563eb" d="M90 176L350 135L610 100"/><path class="line" stroke="#f05a28" d="M90 183L350 155L610 93"/><path class="line" stroke="#17865b" d="M90 278L350 250L610 229"/><g fill="#2563eb"><circle class="dot" cx="90" cy="176" r="8"/><circle class="dot" cx="350" cy="135" r="8"/><circle class="dot" cx="610" cy="100" r="8"/></g><g fill="#f05a28"><circle class="dot" cx="90" cy="183" r="8"/><circle class="dot" cx="350" cy="155" r="8"/><circle class="dot" cx="610" cy="93" r="8"/></g><g fill="#17865b"><circle class="dot" cx="90" cy="278" r="8"/><circle class="dot" cx="350" cy="250" r="8"/><circle class="dot" cx="610" cy="229" r="8"/></g><text x="70" y="335">2022</text><text x="330" y="335">2023</text><text x="590" y="335">2024</text><text x="105" y="164">504</text><text x="365" y="123">510</text><text x="620" y="88">515</text><text x="105" y="206">503</text><text x="365" y="178">507</text><text x="620" y="116">516</text><text x="105" y="300">484</text><text x="365" y="272">488</text><text x="620" y="251">491</text></svg></div><div class="card"><table class="table"><thead><tr><th>Направление</th><th>2022</th><th>2024</th><th>Изм.</th></tr></thead><tbody><tr><td>Чтение</td><td>504</td><td>515</td><td class="blue"><b>+11</b></td></tr><tr><td>Математика</td><td>503</td><td>516</td><td class="orange"><b>+13</b></td></tr><tr><td>Естественные науки</td><td>484</td><td>491</td><td class="green"><b>+7</b></td></tr></tbody></table></div></div><p class="take">В российском ряду 2022–2024 общего падения нет. Есть даже рост!</p><p class="note">Это внутрироссийская динамика, а не прямое сравнение с PISA-2022 или PISA-2025.</p><span class="source">ФГБУ «ФИОКО», общероссийская оценка, 2022–2024</span>`},
{title:'Средний балл растёт. Верхняя часть шкалы почти не меняется',body:`<div class="g2"><div class="card"><h3>Сокращается доля слабой группы</h3><p class="note" style="margin-bottom:16px">Математика: учащиеся ниже порогового уровня</p><div class="bars"><div class="barrow"><span>2022</span><div class="track"><div class="bar" style="--w:100%;--c:#d92d20"></div></div><b class="value">15,8%</b></div><div class="barrow"><span>2023</span><div class="track"><div class="bar" style="--w:48%;--c:#f05a28"></div></div><b class="value">7,6%</b></div></div></div><div class="card"><span class="tag">Верх шкалы</span><div class="num blue" style="font-size:clamp(2.8rem,7vw,6.2rem);line-height:.9;white-space:nowrap">1,5%</div><h3>высокий уровень естественно-научной грамотности</h3><p>ФИОКО отмечает: доля учащихся на высоких уровнях почти не меняется.</p></div></div><p class="take">Средний результат растёт главным образом за счёт сокращения слабой группы.</p><span class="source">ФИОКО, результаты общероссийской оценки, 2023–2024</span>`},
{title:'Восемь направлений «Школы Минпросвещения России»',body:`<div class="dirs">${['Знание','Воспитание','Здоровье','Профориентация','Творчество','Учитель. Школьная команда','Школьный климат','Образовательная среда'].map((x,i)=>`<div class="dir" data-n="0${i+1}">${x}</div>`).join('')}</div><p class="take">С 2022 года школьный климат входит в институциональную модель вместе со знанием, здоровьем, воспитанием и другими направлениями.</p><span class="source">Минпросвещения России, проект «Школа Минпросвещения России»</span>`},
{title:'Функции школы: 2022–2026',body:`<div class="timeline"><div class="time"><div class="year">2022</div><p><b>34 занятия</b> «Разговоры о важном» в учебном году.</p></div><div class="time"><div class="year">2023</div><p>Единые федеральные адаптированные программы для детей с инвалидностью и ОВЗ.</p></div><div class="time"><div class="year">2023</div><p>Общешкольная профориентация и курс «Россия — мои горизонты».</p></div><div class="time"><div class="year">2025/26</div><p><b>&gt;8,5 млн</b> школьников в курсе; <b>&gt;57 000</b> педагогов-психологов в системе образования.</p></div></div><p class="take">К предметному обучению добавились воспитательные, психологические, инклюзивные и профориентационные задачи.</p><span class="source">Минпросвещения России, 2022–2026</span>`},
{title:'Школа стала многозадачной',body:`<div class="g3"><div class="card"><span class="tag">Академическое ядро</span><h3>Знания, контроль, результат</h3><p>Школа по-прежнему отвечает за предметное обучение и функциональную грамотность.</p><div class="flow" style="margin-top:18px"><span>Знания</span><i>→</i><span>Контроль</span><i>→</i><span>Результат</span></div></div><div class="card"><span class="tag">Новые и усиленные функции</span><div class="nodes" style="grid-template-columns:1fr 1fr"><div class="node">Воспитание</div><div class="node">Здоровье</div><div class="node">Психологическая безопасность</div><div class="node">Инклюзия</div><div class="node">Профориентация</div><div class="node">Дополнительное развитие</div></div></div><div class="card"><span class="tag">Что проверяем</span><h3>Не сама «доброжелательность», а распределение времени и внимания</h3><p>Когда функций становится больше, важно не потерять длительное чтение, самостоятельное письмо и работу со сложной задачей.</p></div></div><p class="take warn">Рост числа функций может повышать нагрузку на внимание ученика и учителя. А может и не повышать, мы не знаем.</p>`},
{title:'SEL-программы: социально-эмоциональное обучение',body:`<div class="g2"><div class="card"><h3>Что сравнивали</h3><p>SEL-программы развивают саморегуляцию, социальные навыки, отношения, школьную безопасность и поведение. В метаанализе их сравнили с контрольными условиями.</p><div class="chips"><span>424 исследования</span><span>53 страны</span><span>252 программы</span></div></div><div class="card metric"><span class="tag">Масштаб</span><span class="num green" style="font-size:clamp(2.5rem,5.8vw,5.8rem);white-space:nowrap">575 361</span><p>учащийся</p></div></div><div class="outcomes"><div>Социально-эмоциональные навыки ↑</div><div>Поведение и отношения ↑</div><div>Школьный климат и безопасность ↑</div><div>Школьное функционирование ↑</div><div>Академические достижения ↑</div><div>Эффекты зависят от реализации</div></div><p class="take">Метаанализ не обнаружил обмена благополучия на успеваемость при качественной реализации академические показатели в среднем даже улучшаются.</p>${src(S.sel,'Cipriano et al., Child Development, 2023')}`},
{title:'Тестовая тревожность и учебные показатели',body:`<div class="orbit"><div class="corr"><div><span>Грамотность</span><b class="red">−0,20</b></div><div><span>Математика</span><b class="red">≈ −0,21</b></div><div><span>Академическая самооценка</span><b class="red">−0,41</b></div></div><div class="center">Тестовая<br>тревожность</div><div class="corr"><div><span>Самоэффективность</span><b class="red">−0,39</b></div><div><span>Общая тревога</span><b class="orange">+0,62</b></div><div><span>Депрессивные симптомы</span><b class="orange">+0,45</b></div></div></div><div class="chips"><span>76 исследований</span><span>85 выборок</span><span>53 617 детей 5–12 лет</span></div><p class="take">Высокая тестовая тревожность связана с более низкими академическими результатами.</p><p class="note">Корреляция не доказывает причинную связь.</p>${src(S.anxiety,'Systematic review and meta-analysis, 2023')}`},
{title:'Отношения с учителем и результаты: Россия, 2024',body:`<div class="card"><table class="table"><thead><tr><th>Продуктивные отношения</th><th>Чтение</th><th>Математика</th><th>Естественные науки</th></tr></thead><tbody><tr><td>Низкий уровень</td><td>498</td><td>502</td><td>472</td></tr><tr><td>Средний уровень</td><td>515</td><td>516</td><td>492</td></tr><tr><td><b>Высокий уровень</b></td><td><b>523</b></td><td><b>536</b></td><td><b>503</b></td></tr><tr style="background:#eaf1ff"><td><b>Разница высокий − низкий</b></td><td class="blue"><b>+25</b></td><td class="blue"><b>+34</b></td><td class="blue"><b>+31</b></td></tr></tbody></table></div><div class="chips"><span>Учитель относится справедливо</span><span>Ученик получает помощь</span><span>Учитель слушает ученика</span></div><p class="take">Поддерживающие отношения сочетаются с более высокими результатами по всем трём направлениям.</p><p class="note">Данные корреляционные.</p>${src(S.fioko,'ФИОКО, общероссийская оценка, 2024')}`},
{title:'Четыре различия',body:`<div class="eqs"><div class="eq"><span>Психологическая безопасность</span><b class="neq">≠</b><span>Отсутствие трудности</span></div><div class="eq"><span>Высокие требования</span><b class="neq">≠</b><span>Хронический стресс</span></div><div class="eq"><span>Инклюзия</span><b class="neq">≠</b><span>Снижение требований для всех</span></div><div class="eq"><span>Интерес</span><b class="neq">≠</b><span>Постоянное развлечение</span></div></div><div class="g2" style="margin-top:22px"><div class="card" style="border:2px solid #24a474"><h3 class="green">Рабочее сочетание</h3><div class="num big">Поддержка + трудность</div></div><div class="card" style="border:2px solid #f97066"><h3 class="red">Подмена</h3><div class="num big">Стресс + перегрузка</div></div></div>`},
{title:'Больше домашней работы не означает лучший результат',body:`<div class="g2"><div class="card"><h3>Сколько времени уходит на задания</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px"><div class="metric"><span class="num blue" style="font-size:clamp(2.4rem,5vw,5.2rem);white-space:nowrap">86,5%</span><p>больше часа в день</p></div><div class="metric"><span class="num orange" style="font-size:clamp(2.4rem,5vw,5.2rem);white-space:nowrap">32,7%</span><p>три часа и более</p></div></div><p class="note">Суммарно по всем предметам.</p></div><div class="card"><h3>Результаты при разной длительности</h3><table class="table"><thead><tr><th>Время</th><th>Математика</th><th>Естественные науки</th></tr></thead><tbody><tr><td>&lt;30 мин</td><td>503</td><td>485</td></tr><tr><td>30–60 мин</td><td><b>508</b></td><td>487</td></tr><tr><td>1–2 ч</td><td><b>508</b></td><td><b>489</b></td></tr><tr style="background:#fff2ef"><td>&gt;2 ч</td><td class="red"><b>495</b></td><td class="red"><b>483</b></td></tr></tbody></table></div></div><p class="take">После определённой точки затраты времени растут, а результат не улучшается. При суммарной нагрузке свыше четырёх часов снижается удовлетворённость преподаванием.</p>${src(S.hw,'ФИОКО, результаты общероссийской оценки, 2023')}`},
{title:'Любознательность и функциональная грамотность',body:`<div class="g2"><div class="card"><table class="table"><thead><tr><th>Индекс</th><th>Чтение</th><th>Математика</th><th>Естественные науки</th></tr></thead><tbody><tr><td>Низкий</td><td>508</td><td>508</td><td>483</td></tr><tr><td>Средний</td><td>517</td><td>517</td><td>491</td></tr><tr><td><b>Высокий</b></td><td><b>526</b></td><td><b>528</b></td><td><b>503</b></td></tr></tbody></table></div><div class="card"><h3>Высокий − низкий</h3><div class="bars"><div class="barrow"><span>Чтение</span><div class="track"><div class="bar" style="--w:90%"></div></div><b class="value">+18</b></div><div class="barrow"><span>Математика</span><div class="track"><div class="bar" style="--w:100%;--c:#f05a28"></div></div><b class="value">+20</b></div><div class="barrow"><span>Естественные науки</span><div class="track"><div class="bar" style="--w:100%;--c:#17865b"></div></div><b class="value">+20</b></div></div></div></div><p class="take">Учащиеся с высокой любознательностью показывают более высокие результаты по всем трём направлениям.</p><p class="note">Связь корреляционная.</p>${src(S.curiosity,'ФИОКО, Россия, 2024')}`},
{title:'Поддержка и требования: матрица условий',body:`<div class="g2"><div class="card"><span class="tag">Низкая поддержка + низкие требования</span><h3>Безразличие</h3><p>Нет достаточной помощи и нет ясной академической планки.</p></div><div class="card pressure"><span class="tag">Низкая поддержка + высокие требования</span><h3>Давление</h3><p>Требования есть, но ошибка воспринимается как угроза. Растёт тревожность.</p></div><div class="card"><span class="tag">Высокая поддержка + низкие требования</span><h3>Комфорт без роста</h3><p>Среда безопасна, но сложная самостоятельная работа исчезает.</p></div><div class="card target"><span class="tag">Высокая поддержка + высокие требования</span><h3>Целевой сектор</h3><p>Ясные требования · сложные задачи · право на ошибку · помощь без подмены работы · обратная связь · повторная попытка.</p></div></div><div class="chips"></div>`},
{title:'Три операции с текстом',body:`<div class="steps"><div class="step"><h3>Найти</h3><p>Выделить нужные сведения в длинном тексте.</p></div><div class="step"><h3>Связать</h3><p>Сопоставить несколько источников и увидеть расхождения.</p></div><div class="step"><h3>Оценить</h3><p>Проверить аргументы и сформулировать собственный вывод.</p></div></div><div class="flow" style="margin-top:24px"><span>Длинный текст</span><i>→</i><span>Сравнение источников</span><i>→</i><span>Письменный вывод</span></div><p class="take">Доля <i>hasty reading</i> достигла 9%. Скорость чтения без точности не должна быть учебной целью.</p>${src(S.oecd25,'OECD, PISA 2025 Results, Volume I, 2026')}`},
{title:'Письмо как способ собрать мысль',body:`<div class="g2"><div class="card"><span class="tag">Ручное письмо</span><div class="num blue" style="font-size:clamp(2.2rem,5vw,5.2rem);white-space:nowrap">ES = 0.53</div><p>В 22 исследованиях с участием 6 168 учащихся качество рукописных текстов в среднем было выше.</p></div><div class="card"><span class="tag">Цифровое письмо</span><h3>Набор и редактирование</h3><p>Клавиатурная беглость нужна для работы с большими текстами, перестройки аргумента и подготовки финальной версии.</p></div></div><div class="workflow"><div>План</div><div>Самостоятельный черновик</div><div>Аргументация</div><div>Редактирование</div><div>Финальная версия</div></div><p class="take">Ученик должен владеть обоими способами письма и проходить полный цикл работы над текстом.</p>${src(S.writing,'Malpique et al., The Australian Educational Researcher, 2024')}`}
];
const deck=document.getElementById('deck');deck.innerHTML=slides.map((s,i)=>`<section class="slide${i===0?' active':''}"><div class="frame"><${s.cover?'h1':'h2'}>${s.title}</${s.cover?'h1':'h2'}>${s.body}</div></section>`).join('');
const els=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),progress=document.getElementById('progress');let index=Math.max(0,Math.min(els.length-1,(+location.hash.slice(1)||1)-1));
function show(i,hash=true){index=Math.max(0,Math.min(els.length-1,i));els.forEach((e,n)=>e.classList.toggle('active',n===index));counter.textContent=`${index+1} / ${els.length}`;progress.style.setProperty('--p',`${(index+1)/els.length*100}%`);prev.disabled=index===0;next.disabled=index===els.length-1;if(hash)history.replaceState(null,'',`#${index+1}`);els[index].scrollTop=0}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.onkeydown=e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1)};let x=0;document.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-x;if(Math.abs(d)>60)show(index+(d<0?1:-1))},{passive:true});document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();window.onhashchange=()=>show((+location.hash.slice(1)||1)-1,false);show(index,false);
</script>
</body>
</html>
